[package]
name = "flowview-cli"
version = "0.3.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]
description = "CLI for the flowview HTML template compiler."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
exclude = ["tests/"]
keywords = ["template", "compiler", "html", "cli"]
categories = ["command-line-utilities", "template-engine"]

[[bin]]
name = "flowview"
path = "src/main.rs"

[dependencies]
flowview-compiler = { version = "0.3.0", path = "../flowview-compiler" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3.0"
