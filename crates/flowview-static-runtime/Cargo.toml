[package]
name = "flowview-static-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = ["crates-io"]
description = "Small runtime for precompiled FlowView static templates."
readme = "README.md"
exclude = ["tests/"]
documentation = "https://docs.rs/flowview-static-runtime"
keywords = ["template", "html", "static"]
categories = ["template-engine"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
proptest = "1.7"
