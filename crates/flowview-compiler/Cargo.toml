[package]
name = "flowview-compiler"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "HTML template compiler with Angular-inspired control flow."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/flowview-compiler"
exclude = ["tests/fixtures/js/"]
keywords = ["template", "compiler", "html", "control-flow"]
categories = ["template-engine"]

[lib]
name = "flowview_compiler"
path = "src/lib.rs"

[dependencies]
oxc_allocator = "0.137.0"
oxc_ast = "0.137.0"
oxc_parser = "0.137.0"
oxc_span = "0.137.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sourcemap = "9.2"

[dev-dependencies]
proptest = "1.7"
