name: Fuzz

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

jobs:
  compiler:
    name: Compiler (${{ github.event_name == 'schedule' && 'scheduled' || 'smoke' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust for libFuzzer
        run: rustup toolchain install nightly --profile minimal
      - name: Build compiler fuzz target
        run: cargo +nightly install cargo-fuzz --locked && cargo +nightly fuzz build compiler
      - name: Run bounded fuzzing
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '600' || '75' }}
        run: cargo +nightly fuzz run compiler -- -max_total_time="$FUZZ_SECONDS" -max_len=8192 -timeout=10 -rss_limit_mb=4096
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-fuzz-artifacts-${{ github.run_id }}
          path: fuzz/artifacts/
          if-no-files-found: warn
          retention-days: 14
