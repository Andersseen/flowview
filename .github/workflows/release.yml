name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Pack once, validate every tarball, npm publish --dry-run, external Vite and
  # Astro consumers on three OSes, the Vite/Astro/Prettier compatibility
  # matrices, and the minimum Node. Publishing below cannot start unless every
  # one of those jobs passed.
  release-readiness:
    name: Release readiness
    uses: ./.github/workflows/release-readiness.yml

  release:
    needs: release-readiness
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install WASM toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --locked

      - name: Install dependencies
        run: pnpm install

      - name: Build Rust compiler
        run: cargo build --workspace

      # Publish the exact build the readiness gates verified instead of
      # rebuilding it: `changeset publish` packs from these directories.
      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: flowview-packed-npm-artifacts
          path: ${{ runner.temp }}/verified

      - name: Download verified package outputs
        uses: actions/download-artifact@v4
        with:
          name: flowview-built-packages
          path: ${{ runner.temp }}/built

      - name: Restore verified package outputs
        run: tar -xzf "$RUNNER_TEMP/built/flowview-built-packages.tgz"

      - name: Confirm the outputs repack to the verified artifacts
        run: |
          node scripts/pack-release-artifacts.mjs "$RUNNER_TEMP/repacked"
          node scripts/compare-release-artifacts.mjs "$RUNNER_TEMP/verified" "$RUNNER_TEMP/repacked"

      - name: Test packages
        run: |
          pnpm run test:runtime
          pnpm run test:reactive
          pnpm run test:dom
          pnpm run test:events
          pnpm run test:compiler
          pnpm run test:vite
          pnpm run test:astro
          pnpm run test:astro-events
          pnpm run test:vite-events
          pnpm run test:prettier

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm exec changeset publish
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
