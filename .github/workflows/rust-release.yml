name: Rust release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the gate and `cargo publish --dry-run` only"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Quality gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo doc -p flowview-compiler --no-deps --locked

      - name: Package workspace
        # Workspace tests compile the CLI against the local compiler. Package
        # verification instead resolves its registry dependency, which can lag
        # the compiler API until the Rust release script publishes it.
        run: cargo package --workspace --exclude flowview-wasm --locked --no-verify

      - name: Verify compiler publish
        run: cargo publish --dry-run -p flowview-compiler --locked

      - name: Publish flowview-compiler, then flowview-cli
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not configured; refusing to publish." >&2
            exit 1
          fi
          scripts/publish-rust.sh
