name: Rust release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the gates, package inspection and `cargo publish --dry-run` only"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  msrv:
    name: Rust MSRV gate
    uses: ./.github/workflows/rust-msrv.yml

  publish:
    needs: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Quality gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Package workspace
        # Workspace tests compile the CLI against the local compiler. Package
        # verification instead resolves its registry dependency, which can lag
        # the compiler API until the Rust release script publishes it.
        run: cargo package --workspace --exclude flowview-wasm --locked --no-verify

      - name: Inspect packages
        # Inspects every publishable .crate archive produced above.
        run: |
          ls -l target/package/*.crate
          for crate in target/package/*.crate; do
            name="$(basename "$crate" .crate)"
            echo "::group::$name contents"
            tar -tzf "$crate"
            echo "::endgroup::"
            files="$(tar -tzf "$crate" | sed "s#^$name/##")"
            for required in README.md LICENSE Cargo.toml; do
              echo "$files" | grep -qx "$required" || { echo "$name: $required missing from package" >&2; exit 1; }
            done
            if echo "$files" | grep -E '^(target|node_modules|fuzz|tests)/|(^|/)\.env'; then
              echo "$name: unexpected files in package" >&2; exit 1
            fi
          done

      - name: Dry-run publish
        # Compiler always; the CLI only once its exact compiler version is in
        # the registry (cargo cannot resolve it before that).
        run: scripts/publish-rust.sh --dry-run

      - name: Publish runtime, compiler, then CLI with registry consumer checks
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not configured; refusing to publish." >&2
            exit 1
          fi
          scripts/publish-rust.sh
